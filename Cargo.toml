[package]
name = "waitpidx"
version = "0.0.0"
authors = ["Konge <zkonge@outlook.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zkonge/waitpidx"
keywords = ["waitpid", "process", "linux"]
categories = ["os"]
readme = "README.md"

[dependencies]
classic_bpf = { version = "0.1.1", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
libc = "0.2.174"
linux-raw-sys = { version = "0.9.4", features = ["netlink"], optional = true }
rustix = { version = "1.0.7", features = ["event", "process"] }
tokio = { version = "1.45.1", features = ["net"], optional = true }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["rt"] }
futures-util = { version = "0.3.31", default-features = false, features = [
    "alloc",
] }

[features]
default = ["async"]
async = ["dep:tokio"]
netlink = [
    "dep:classic_bpf",
    "dep:crossbeam-channel",
    "dep:linux-raw-sys",
    "rustix/pipe",
    "rustix/net",
]
async-netlink = ["async", "netlink", "tokio/rt", "tokio/sync"]

[[example]]
name = "waitpid_async"
required-features = ["async"]

[[example]]
name = "waitpid_many_async"
required-features = ["async"]

[[example]]
name = "waitpid"
